name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo ref torna a execução anterior irrelevante.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      # O resultado depende só da versão do TypeScript, não da do Node.
      - name: Verifica os tipos publicados
        if: matrix.node == 20
        run: npm run test:types
